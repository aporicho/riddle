[package]
name = "magicpaper"
version = "0.8.1"
edition = "2021"
license = "MIT"
description = "MagicPaper (MP), living magical paper for reMarkable Paper Pro and Paper Pro Move"
repository = "https://github.com/aporicho/magicpaper"

[dependencies]
libc = "0.2"
signal-hook = "0.3"
png = "0.17"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
# HTTP + TLS for the PaddleOCR client. Provider/model traffic is owned by the
# ReMagic-hosted Pi Agent and never leaves MagicPaper directly.
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[features]
# Link libquill.so (vendor e-ink engine C ABI) for full-takeover mode.
takeover = []

[profile.release]
strip = true
lto = true
